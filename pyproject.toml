[project]
name = "catan-trainer"
version = "0.1.0"
description = "1v1 Colonist-variant Catan engine and tactics trainer"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "numpy>=2.2.6",
    "playwright>=1.61.0",
    "pytest>=8",
    "torch>=2.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: long-running strength benchmarks (run with: uv run pytest -m slow)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "agents", "search", "net", "puzzles", "trainer"]
